# Per-repo no-mistakes overrides.

# This repository has no CI workflows or check-runs; the pipeline CI step
# must not babysit an open PR for checks that will never register.
no_ci: true

# Pin the deterministic test gate to the project's canonical unit-test suite.
# The toolchain lives in /home/jasonto/.lumi-dev (no system Java or Android
# SDK; see AGENTS.md), so the environment is pinned explicitly. Without this,
# the agent-driven test step re-derives the command each run and has timed
# out authoring extra Robolectric coverage from scratch.
commands:
  test: 'sh -c "cd android && JAVA_HOME=/home/jasonto/.lumi-dev/jdk ANDROID_HOME=/home/jasonto/.lumi-dev/android-sdk ./gradlew testDebugUnitTest"'
